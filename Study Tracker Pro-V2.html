  <style>

    .task-row{grid-template-columns:auto 1fr auto;align-items:start}.task-check{margin-top:3px}.task-duration{font-weight:800}.priority{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.priority.High{color:var(--red)}.priority.Medium{color:var(--amber)}.date-nav{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px}.date-nav button{border:0;background:none;font-size:1.3rem;color:var(--blue)}.score{display:flex;align-items:center;gap:18px}.ring{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) var(--p),var(--surface2) 0);position:relative;flex:none}.ring:after{content:"";position:absolute;inset:10px;background:var(--surface);border-radius:50%}.ring strong{z-index:1;font-size:1.25rem}.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}.stat{background:var(--surface);padding:17px}.stat strong{font-size:1.25rem;display:block;background:linear-gradient(120deg,var(--ink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase}.chart{height:180px;display:flex;gap:8px;align-items:end;border-bottom:1px solid var(--line);padding-top:20px}.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;text-align:center;gap:6px}.bar{min-height:3px;background:linear-gradient(180deg,var(--gb),var(--ga));border-radius:6px 6px 0 0;animation:grow .7s ease both;transform-origin:bottom}@keyframes grow{from{transform:scaleY(0)}}.bar-wrap small{font-size:.62rem;color:var(--muted)}.history-row{display:grid;grid-template-columns:1fr repeat(3,auto);gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:.84rem}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.setting-row p{margin:2px 0 0}.subject-head{display:flex;justify-content:space-between;gap:15px;align-items:start}
    .chapter-table{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);margin-top:14px}.chapter-thead{display:grid;grid-template-columns:1fr 88px 82px 44px;gap:10px;padding:10px 14px;background:var(--surface2);font-size:.65rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.chapter-thead span:nth-child(2),.chapter-thead span:nth-child(3){text-align:center}.chapter-trow{display:grid;grid-template-columns:1fr 88px 82px 44px;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface)}.ch-main b{font-size:.9rem;display:block}.ch-sub{font-size:.72rem;color:var(--muted);margin:3px 0 7px}.progress-line.mini{height:6px}.ch-est{display:grid;gap:4px;justify-items:center}.ch-est label{font-size:.58rem;font-weight:850;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.ch-est input{width:100%;min-height:38px;padding:6px;border:1px solid var(--line);border-radius:9px;background:var(--bg);text-align:center;font-weight:750}.ch-est input:focus{border-color:var(--blue)}.ch-studied{text-align:center}.ch-studied strong{display:block;font-size:.9rem}.ch-studied span{font-size:.67rem;color:var(--muted)}.chapter-actions{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}.chapter-actions button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 10px;font-size:.73rem}.chapter-actions button:hover{border-color:var(--blue);color:var(--blue)}
    .session-line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.session-line b{display:block;font-size:.86rem}.link-danger{border:1px solid color-mix(in srgb,var(--red) 35%,transparent);background:transparent;color:var(--red);border-radius:8px;padding:7px 11px;font-size:.72rem;font-weight:800}.link-danger:hover{background:color-mix(in srgb,var(--red) 10%,transparent)}
    .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:.83rem;box-shadow:var(--shadow);animation:toast .25s ease;max-width:92vw;text-align:center}@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}
    @media(min-width:800px){.shell{padding:0 0 0 220px}.topbar{margin-left:220px}.bottom-nav{top:0;bottom:0;right:auto;width:220px;height:auto;display:flex;flex-direction:column;padding:110px 14px 20px;border-right:1px solid var(--line);border-top:0}.nav-btn{height:54px;text-align:left;padding:0 18px;border-radius:12px;font-size:.8rem}.nav-btn b{display:inline;margin-right:13px}.nav-btn.active{background:var(--surface2)}main{padding:32px}.split{grid-template-columns:1.15fr .85fr}.hero{min-height:380px;padding:35px}.hero-bottom{left:35px;bottom:35px}.stats-grid{grid-template-columns:repeat(4,1fr)}}

<body>
  <div id="app"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <dialog id="modal"><div id="modalContent"></div></dialog>

  <script>
  "use strict";
  const CA_FINAL_COURSE_CONFIG={scheme:"ICAI New Scheme",groups:{group1:{name:"Group I",papers:[{id:"p1",paper:1,name:"Financial Reporting",short:"FR"},{id:"p2",paper:2,name:"Advanced Financial Management",short:"AFM"},{id:"p3",paper:3,name:"Advanced Auditing, Assurance and Professional Ethics",short:"Audit"}]},group2:{name:"Group II",papers:[{id:"p4",paper:4,name:"Direct Tax Laws & International Taxation",short:"DT"},{id:"p5",paper:5,name:"Indirect Tax Laws",short:"IDT"},{id:"p6",paper:6,name:"Integrated Business Solutions",short:"IBS",note:"Multidisciplinary Case Study with Strategic Management"}]}}};
  const MOTIVATIONS=["Padhle bhai, warna phir se November-November khelte rahenge.","Tera competition abhi bhi padh raha hai. Tu yahan quote kyun dekh raha hai?","Excuses marksheet par print nahi hote.","Log teri mehnat nahi, sirf result dekhenge. Result de unhe.","You didn't survive articleship to be defeated by a syllabus.","Half your batch will quit midway. That is exactly your opportunity.","Tune itna sab sacrifice kiya hai — ab ek chapter nahi padhega?","While you scrolled 20 minutes, someone finished a revision test.","'Kal se pakka' — kal kabhi nahi aata. Aaj aata hai.","Nobody is coming to save your attempt. Pick up the book.","Do saal baad tu ya to khud ko thank you bolega, ya 'wish'. Aaj choose kar.","The exam doesn't care about your mood. It cares about your preparation.","Average effort, average result, average life. Today is your chance to be exceptional.","Rank holders don't get more hours. They just stop negotiating with themselves.","Ek chapter roz extra = 30 chapters in a month. Bas shuru kar.","Duniya dekh rahi hai: tu CA banega, ya bas 'CA banunga' bolta rahega.","Your parents already told everyone you will clear it. Don't make them lie.","Sleep is temporary. 'CA' before your name is permanent.","Talent gets attention. Discipline gets the degree. Consistency gets the rank.","Stop counting days left. Start counting chapters left.","You are one lazy month away from 'bas ho gaya' and one focused month away from 'ho gaya'. Choose.","Mehnat teri hai, degree tere naam ki hogi. Fair deal. Padh le.","Every hour you skip, your rival logs. Ranks are limited. Hours are not.","Future tu kal is quote ko dobara padhega — proud hoke ya Sharma ji ka beta banke.","Warmukh hona easy hai. CA Final clear karna thoda nahi. Chal, timer on kar."];
  const ACCOUNTABILITY={Gentle:"Thoda progress bhi progress hai. Par 'thoda' se CA Final nahi hota. Chal, agla chapter khol.",Firm:"Tune hi plan banaya tha, bhai. Ab ya plan justify kar, ya honestly deadline badal. Beech ka rasta nahi hai.",Strict:"Timetable se negotiation band. Books khol. Abhi. Is second."};
  const KEY="ankit_ca_tracker_v2";
  const store={get(){try{return localStorage.getItem(KEY)}catch(e){return null}},set(v){try{localStorage.setItem(KEY,v)}catch(e){}},clear(){try{localStorage.removeItem(KEY)}catch(e){}}};
  const today=()=>new Date().toISOString().slice(0,10);
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const clamp=(n,a=0,b=100)=>Math.min(b,Math.max(a,Number(n)||0));
  const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
  const fmtMin=m=>{m=Math.max(0,Math.round(Number(m)||0));const h=Math.floor(m/60),r=m%60;return h?(r?`${h}h ${r}m`:`${h}h`):`${r}m`};
  const niceDate=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:d.slice(0,4)!==today().slice(0,4)?"numeric":undefined});
  const daysTo=d=>d?Math.ceil((new Date(d+"T23:59:59")-new Date())/86400000):null;
  const allPapers=()=>Object.values(CA_FINAL_COURSE_CONFIG.groups).flatMap(g=>g.papers.map(p=>({...p,group:g.name})));
  function defaults(){return{version:2,profile:null,subjects:[],tasks:[],sessions:[],settings:{theme:"system",palette:"indigo",accountability:"Firm",motivation:true,notifications:false,minStreakMinutes:60},meta:{createdAt:new Date().toISOString(),lastOpen:today(),motivationIndex:0},courseTarget:"",examDates:{group1:"",group2:""}}}
  function load(){try{const x=JSON.parse(store.get());return x?migrate(x):defaults()}catch(e){return defaults()}}
  function migrate(x){const d=defaults();return{...d,...x,settings:{...d.settings,...x.settings},meta:{...d.meta,...x.meta},examDates:{...d.examDates,...x.examDates},subjects:Array.isArray(x.subjects)?x.subjects:[],tasks:Array.isArray(x.tasks)?x.tasks:[],sessions:Array.isArray(x.sessions)?x.sessions:[]}}
  let state=load(),page="home",planDate=today();
  const save=()=>store.set(JSON.stringify(state));
  function applyTheme(){let t=state.settings.theme;if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.dataset.palette=state.settings.palette||"indigo";document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#070b16":"#eef1f8"}
  function chapterPct(c){return c.status==="Completed"?100:c.status==="Not Started"?0:clamp(c.completion)}
  function subjectStats(s){const cs=s.chapters||[],est=cs.reduce((a,c)=>a+(+c.estimated||0),0),actual=cs.reduce((a,c)=>a+(+c.actual||0),0);const pct=est?cs.reduce((a,c)=>a+(+c.estimated||0)*chapterPct(c)/100,0)/est*100:cs.length?cs.reduce((a,c)=>a+chapterPct(c),0)/cs.length:0;return{est,actual,remaining:Math.max(0,est-actual),pct:clamp(pct),complete:cs.filter(c=>chapterPct(c)===100).length,inprogress:cs.filter(c=>chapterPct(c)>0&&chapterPct(c)<100).length}}
  function overall(){const list=state.subjects.map(subjectStats),est=list.reduce((a,x)=>a+x.est,0),actual=list.reduce((a,x)=>a+x.actual,0);let pct;if(est)pct=state.subjects.reduce((a,s)=>a+s.chapters.reduce((b,c)=>b+(+c.estimated||0)*chapterPct(c)/100,0),0)/est*100;else{const cs=state.subjects.flatMap(s=>s.chapters);pct=cs.length?cs.reduce((a,c)=>a+chapterPct(c),0)/cs.length:0}return{est,actual,remaining:Math.max(0,est-actual),pct:clamp(pct)}}

  function subjectRow(s){const x=subjectStats(s);return `<div class="subject-row" onclick="subjectDetail('${s.id}')" role="button" tabindex="0"><div><h3>${esc(s.short)} | ${esc(s.name)}</h3><div class="subject-meta">${x.complete}/${s.chapters.length} chapters | ${x.actual.toFixed(1)}/${x.est.toFixed(1)} hours</div></div><div class="pct">${x.pct.toFixed(1)}%</div><div class="progress-line"><i style="--w:${x.pct}%"></i></div></div>`}

  function progressPage(){const o=overall(),rev=n=>{const cs=state.subjects.flatMap(s=>s.chapters);return cs.length?cs.filter(c=>c[n]).length/cs.length*100:0};return `<section class="page"><div class="eyebrow">Syllabus and revision</div><h1 style="font-size:2.5rem">Know exactly where you stand.</h1><div class="stats-grid"><div class="stat"><strong>${o.pct.toFixed(1)}%</strong><span>Syllabus</span></div><div class="stat"><strong>${rev("revision1").toFixed(0)}%</strong><span>Revision 1</span></div><div class="stat"><strong>${rev("revision2").toFixed(0)}%</strong><span>Revision 2</span></div><div class="stat"><strong>${state.subjects.flatMap(s=>s.chapters).filter(c=>c.mock).length}</strong><span>Mocks done</span></div></div><div class="section-head"><h2>${CA_FINAL_COURSE_CONFIG.scheme}</h2></div><div class="plain-list">${state.subjects.map(subjectRow).join("")}</div><p class="disclaimer">Subject structure is based on the latest ICAI course/examination information configured in this app. Always verify applicability with the latest ICAI announcement/study material.</p></section>`}
  function subjectDetail(id){const s=state.subjects.find(x=>x.id===id);if(!s)return;const x=subjectStats(s),days=daysTo(s.target),req=x.remaining/Math.max(1,days||1);openModal(`${modalHead(s.short+" | "+esc(s.name))}<div class="modal-body"><div class="subject-head"><div><div class="eyebrow">Paper ${s.paper}</div><h1 style="font-size:2.6rem">${x.pct.toFixed(1)}%</h1></div><button class="secondary" onclick="subjectTargetModal('${s.id}')">${s.target?niceDate(s.target):"Set target"}</button></div><div class="progress-line"><i style="--w:${x.pct}%"></i></div><p class="muted">${x.complete} complete | ${x.inprogress} in progress | ${s.chapters.length-x.complete-x.inprogress} remaining<br>${x.actual.toFixed(1)}h studied | ${x.remaining.toFixed(1)}h remaining${s.target?` | ${days<0?"Target missed":req.toFixed(1)+"h/day required"}`:""}</p><div class="section-head"><h2>Chapters</h2><button style="color:var(--blue)" onclick="chapterModal('${s.id}')">+ Add chapter</button></div><div class="chapter-table"><div class="chapter-thead"><span>Chapter</span><span>Est. hrs</span><span>Studied</span><span>Done</span></div>${s.chapters.length?s.chapters.map(c=>chapterRow(s,c)).join(""):`<div style="padding:16px 14px;background:var(--surface)" class="muted">Add at least one chapter.</div>`}</div><div class="btn-row" style="margin-top:18px"><button class="secondary" onclick="closeModal()">← Back</button><button class="primary" onclick="sessionModal()">Log study</button></div></div>`)}window.subjectDetail=subjectDetail;
  function chapterRow(s,c){const est=+c.estimated||0,act=+c.actual||0,p=chapterPct(c);return `<div class="chapter-trow"><div class="ch-main"><b>${esc(c.name)}</b><div class="ch-sub"><span class="priority ${c.priority}">${c.priority}</span> · ${c.status} · Left ${Math.max(0,est-act).toFixed(1)}h</div><div class="progress-line mini"><i style="--w:${p}%"></i></div></div><div class="ch-est"><label>Est. hrs</label><input type="number" min="0" max="500" step="0.5" value="${est}" onchange="setEst('${s.id}','${c.id}',this.value)" aria-label="Estimated hours for ${esc(c.name)}"></div><div class="ch-studied"><strong>${act.toFixed(1)}h</strong><span>/ ${est.toFixed(1)}h</span></div><input type="checkbox" ${p===100?"checked":""} onchange="completeChapter('${s.id}','${c.id}')" aria-label="Mark ${esc(c.name)} complete"><div class="chapter-actions"><button onclick="moveChapter('${s.id}','${c.id}',-1)">↑ Up</button><button onclick="moveChapter('${s.id}','${c.id}',1)">↓ Down</button><button onclick="chapterModal('${s.id}','${c.id}')">✎ Edit</button><button onclick="revisionToggle('${s.id}','${c.id}','revision1')">R1 ${c.revision1?"✓":""}</button><button onclick="revisionToggle('${s.id}','${c.id}','revision2')">R2 ${c.revision2?"✓":""}</button><button onclick="revisionToggle('${s.id}','${c.id}','mock')">Mock ${c.mock?"✓":""}</button><button class="danger" onclick="deleteChapter('${s.id}','${c.id}')">Delete</button></div></div>`}

  function analyticsPage(){const total=state.sessions.reduce((a,s)=>a+(+s.minutes||0),0),dates=[...new Set(state.sessions.map(s=>s.date))],best=dates.sort((a,b)=>studiedOn(b)-studiedOn(a))[0],streaks=getStreaks(),allTasks=state.tasks.filter(t=>!t.deleted),completed=allTasks.filter(t=>t.completed).length,o=overall(),subs=[...state.subjects].sort((a,b)=>subjectStats(b).pct-subjectStats(a).pct),week=lastDays(7);return `<section class="page"><div class="eyebrow">Performance analytics</div><h1 style="font-size:2.5rem">Measure the work, not the intention.</h1><div class="stats-grid"><div class="stat"><strong>${fmtMin(total)}</strong><span>Total study</span></div><div class="stat"><strong>${fmtMin(averageMinutes())}</strong><span>Daily average</span></div><div class="stat"><strong>${streaks.current} days</strong><span>Current streak</span></div><div class="stat"><strong>${streaks.best} days</strong><span>Best streak</span></div></div><div class="split"><div><div class="section-head"><h2>Weekly study hours</h2></div><div class="panel"><div class="chart">${week.map(d=>{const m=studiedOn(d);return `<div class="bar-wrap"><b class="tiny">${(m/60).toFixed(1)}</b><div class="bar" style="height:${Math.min(100,m/Math.max(60,...week.map(studiedOn))*100)}%"></div><small>${new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short"})}</small></div>`}).join("")}</div></div></div><div><div class="section-head"><h2>Key outcomes</h2></div><div class="panel"><div class="setting-row"><span>Tasks completed</span><b>${completed} / ${allTasks.length}</b></div><div class="setting-row"><span>Completion rate</span><b>${allTasks.length?(completed/allTasks.length*100).toFixed(1):0}%</b></div><div class="setting-row"><span>Syllabus completion</span><b>${o.pct.toFixed(1)}%</b></div><div class="setting-row"><span>Best study day</span><b>${best?niceDate(best):"No data"}</b></div></div></div></div><div class="section-head"><h2>Subject completion</h2></div><div class="plain-list">${subs.map(subjectRow).join("")||`<div class="panel">No subject data yet.</div>`}</div></section>`}
  function lastDays(n){return Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return d.toISOString().slice(0,10)})}
  function getStreaks(){const active=[...new Set(state.sessions.filter(s=>studiedOn(s.date)>=state.settings.minStreakMinutes).map(s=>s.date))].sort();let best=0,run=0,prev=null;for(const d of active){if(prev&&(new Date(d)-new Date(prev))/86400000===1)run++;else run=1;best=Math.max(best,run);prev=d}let current=0,d=new Date();if(studiedOn(today())<state.settings.minStreakMinutes)d.setDate(d.getDate()-1);while(active.includes(d.toISOString().slice(0,10))){current++;d.setDate(d.getDate()-1)}return{best,current}}

  function addSession(e){e.preventDefault();const f=new FormData(e.target),s=state.subjects.find(x=>x.id===f.get("subjectId")),c=s?.chapters.find(x=>x.id===f.get("chapterId"));let minutes=Math.round((+f.get("hours")||0)*60);if(!minutes&&f.get("start")&&f.get("end")){const [sh,sm]=f.get("start").split(":").map(Number),[eh,em]=f.get("end").split(":").map(Number);minutes=(eh*60+em)-(sh*60+sm);if(minutes<0)minutes+=1440}if(!c||minutes<=0||minutes>1440)return toast("Choose a chapter and valid duration.");const hours=minutes/60;c.actual=(+c.actual||0)+hours;if(c.status==="Not Started"){c.status="In Progress";c.completion=Math.max(5,c.completion||0)}state.sessions.push({id:uid(),subjectId:s.id,chapterId:c.id,date:f.get("date"),minutes,start:f.get("start"),end:f.get("end"),notes:f.get("notes"),createdAt:new Date().toISOString()});save();closeModal();render();toast("Study time logged. Aur padh.")}window.addSession=addSession;

  function resetDayModal(date){const ss=sessionsOn(date),mins=ss.reduce((a,x)=>a+(+x.minutes||0),0),ts=tasksOn(date);openModal(`${modalHead("Reset day | "+niceDate(date))}<div class="modal-body"><p class="muted">Entered something wrong for this day? Removing a study session also reverses the hours added to that chapter, so your progress stays honest.</p>${ss.length?`<div style="margin:14px 0 4px"><b class="tiny">SESSIONS LOGGED THIS DAY</b>${ss.map(x=>{const s=state.subjects.find(y=>y.id===x.subjectId),c=s?.chapters.find(y=>y.id===x.chapterId);return `<div class="session-line"><div><b>${esc(s?.short||"General")} | ${esc(c?.name||"Chapter")}</b><span class="tiny muted">${x.start&&x.end?x.start+"–"+x.end+" · ":""}${fmtMin(x.minutes)}${x.notes?" · "+esc(x.notes):""}</span></div><button class="link-danger" onclick="removeSession('${x.id}','${date}')">Remove</button></div>`}).join("")}</div>`:`<p class="muted tiny" style="margin-top:12px">No study sessions logged for this day.</p>`}<form onsubmit="resetDaySave(event,'${date}')"><label class="check-option"><input type="checkbox" name="sessions" ${ss.length?"checked":""}><span><b>Delete ALL study time for this day</b><span class="tiny muted" style="display:block">${ss.length?`${ss.length} sessions · ${fmtMin(mins)} will be removed`:"Nothing to delete"}</span></span></label><label class="check-option"><input type="checkbox" name="tasks"><span><b>Also delete this day's tasks</b><span class="tiny muted" style="display:block">${ts.length} tasks</span></span></label><div class="btn-row" style="margin-top:16px"><button type="button" class="secondary" onclick="closeModal()">← Back</button><button class="danger-btn">Reset selected</button></div></form></div>`)}window.resetDayModal=resetDayModal;

  function detailsStep(){return `<div class="eyebrow">Step 1 of 3</div><h1 style="font-size:2.7rem">Tell us about your attempt.</h1><form onsubmit="saveDetails(event)"><div class="form-grid"><div class="field"><label>Full name</label><input name="name" required autocomplete="name"></div><div class="field"><label>Preferred name</label><input name="preferred"></div><div class="field"><label>Age</label><input name="age" type="number" min="16" max="80"></div><div class="field"><label>Registration / status</label><input name="status" placeholder="Registered / Articleship"></div><div class="field"><label>Exam attempt</label><input name="attempt" placeholder="November 2026"></div><div class="field"><label>Preparation stage</label><select name="stage"><option>Both Groups</option><option>Group I</option><option>Group II</option><option>Custom / Selected Papers</option></select></div><div class="field"><label>Realistic study hours / day</label><input name="dailyHours" type="number" min="0.5" max="24" step="0.5" value="6" required></div><div class="field"><label>Target completion date (optional)</label><input name="target" type="date"></div></div><button class="primary">Choose subjects</button></form>`}
  function saveDetails(e){e.preventDefault();const f=new FormData(e.target);onboardDraft.profile={name:f.get("name").trim(),preferred:f.get("preferred").trim(),age:+f.get("age")||null,status:f.get("status").trim(),attempt:f.get("attempt").trim(),stage:f.get("stage"),dailyHours:+f.get("dailyHours")};onboardDraft.stage=f.get("stage");onboardDraft.target=f.get("target");const ids=onboardDraft.stage==="Both Groups"?allPapers().map(p=>p.id):onboardDraft.stage==="Group I"?allPapers().filter(p=>p.group==="Group I").map(p=>p.id):onboardDraft.stage==="Group II"?allPapers().filter(p=>p.group==="Group II").map(p=>p.id):[];onboardDraft.selected=ids;onboardStep=2;render()}window.saveDetails=saveDetails;
  function subjectsStep(){return `<div class="eyebrow">Step 2 of 3 | ${CA_FINAL_COURSE_CONFIG.scheme}</div><h1 style="font-size:2.7rem">Select your papers.</h1><form onsubmit="saveSubjects(event)">${allPapers().map(p=>`<label class="paper-option"><input type="checkbox" name="paper" value="${p.id}" ${onboardDraft.selected.includes(p.id)?"checked":""}><span><b>Paper ${p.paper} | ${esc(p.name)}</b><small class="muted" style="display:block">${p.group}${p.note?" | "+p.note:""}</small></span><span class="tiny muted">Not configured</span></label>`).join("")}<p class="disclaimer">Subject structure is based on the latest ICAI course/examination information configured in this app. Always verify applicability with the latest ICAI announcement/study material.</p><div class="btn-row" style="margin-top:15px"><button type="button" class="secondary" onclick="backOnboard()">← Back</button><button class="primary">Set up syllabus</button></div></form>`}
  function saveSubjects(e){e.preventDefault();onboardDraft.selected=new FormData(e.target).getAll("paper");if(!onboardDraft.selected.length)return toast("Please select at least one subject.");onboardStep=3;render()}window.saveSubjects=saveSubjects;
  function chaptersStep(){const papers=allPapers().filter(p=>onboardDraft.selected.includes(p.id));return `<div class="eyebrow">Step 3 of 3</div><h1 style="font-size:2.7rem">Set up your syllabus.</h1><p class="muted">Choose how many chapter rows to create and the estimated hours per chapter. You can rename, reorder and edit them anytime.</p><form onsubmit="finishSetup(event)">${papers.map(p=>`<label class="paper-option"><span><b>${esc(p.short)} | ${esc(p.name)}</b><small class="muted" style="display:block">Chapters count · est. hrs per chapter</small></span><span style="display:flex;gap:8px;align-items:center"><input class="chapter-count" name="${p.id}" type="number" min="1" max="100" value="3" required aria-label="Chapters for ${esc(p.short)}"><input class="chapter-count" style="width:84px!important" name="${p.id}_est" type="number" min="0.5" max="100" step="0.5" value="5" required aria-label="Estimated hours per chapter for ${esc(p.short)}"></span></label>`).join("")}<div class="btn-row" style="margin-top:22px"><button type="button" class="secondary" onclick="backOnboard()">← Back</button><button class="primary">Open my dashboard</button></div></form>`}
  function finishSetup(e){e.preventDefault();const f=new FormData(e.target),papers=allPapers().filter(p=>onboardDraft.selected.includes(p.id));state=defaults();state.profile=onboardDraft.profile;state.courseTarget=onboardDraft.target;state.subjects=papers.map(p=>({...p,target:"",chapters:Array.from({length:+f.get(p.id)},(_,i)=>({id:uid(),name:`Chapter ${i+1}`,estimated:+(f.get(p.id+"_est")||5),actual:0,priority:"Medium",status:"Not Started",completion:0,revision1:false,revision2:false,mock:false}))}));save();page="home";render();toast("Your CA Final plan is ready. Ab bas padhna shuru kar.")}window.finishSetup=finishSetup;
  function checkNewDay(){if(state.meta.lastOpen!==today()){const previous=state.meta.lastOpen;state.meta.lastOpen=today();state.meta.motivationIndex=(state.meta.motivationIndex+1)%MOTIVATIONS.length;save();const pending=tasksOn(previous).some(t=>!t.completed);if(pending)setTimeout(()=>carryModal(previous),300);else if(state.settings.motivation)setTimeout(()=>openModal(`${modalHead("A new study day")}<div class="modal-body"><div class="quote">${esc(MOTIVATIONS[state.meta.motivationIndex])}</div><button class="primary full" style="margin-top:22px" onclick="closeModal()">Padhle bhai — start today's work</button></div>`),300)}}
  applyTheme();render();
  </script>
</body>
</html>
